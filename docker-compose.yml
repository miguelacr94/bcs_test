
services:
  # ------------------------------------
  # 1. Bases de Datos y Message Broker
  # ------------------------------------
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - store-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - store-network

  # ------------------------------------
  # 2. Microservicios (Backend)
  # ------------------------------------
  auth-service:
    build:
      context: .
      args:
        - APP_NAME=auth
    environment:
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongodb:27017/store_auth
    depends_on:
      - redis
      - mongodb
    networks:
      - store-network

  products-service:
    build:
      context: .
      args:
        - APP_NAME=products
    environment:
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongodb:27017/store_products
    depends_on:
      - redis
      - mongodb
    networks:
      - store-network

  orders-service:
    build:
      context: .
      args:
        - APP_NAME=orders
    environment:
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongodb:27017/store_orders
    depends_on:
      - redis
      - mongodb
    networks:
      - store-network

  # ------------------------------------
  # 3. API Gateway (Puerta Frontal)
  # ------------------------------------
  api-gateway:
    build:
      context: .
      args:
        - APP_NAME=api-gateway
    ports:
      - "3000:3000" # Exponemos el Gateway al mundo exterior
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - auth-service
      - products-service
      - orders-service
    networks:
      - store-network

# ------------------------------------
# Redes y Volúmenes compartidos
# ------------------------------------
networks:
  store-network:
    driver: bridge

volumes:
  mongo-data: # Para que la base de datos no se borre si apagamos Docker
